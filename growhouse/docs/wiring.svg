<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" width="1160" height="820" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1160" height="820" fill="#ffffff"/>

  <!-- ============ title ============ -->
  <text x="40" y="52" font-size="23" font-weight="700" fill="#111827">Automated Growhouse</text>
  <text x="40" y="76" font-size="13" fill="#6b7280">Wiring diagram. Pin assignments taken from src/growhouse.ino</text>

  <!-- ============ legend ============ -->
  <g font-size="11" fill="#374151">
    <line x1="760" y1="42" x2="792" y2="42" stroke="#2563eb" stroke-width="2.5"/>
    <text x="800" y="46">signal</text>
    <line x1="870" y1="42" x2="902" y2="42" stroke="#dc2626" stroke-width="2.5"/>
    <text x="910" y="46">+5 V</text>
    <line x1="970" y1="42" x2="1002" y2="42" stroke="#ea580c" stroke-width="2.5"/>
    <text x="1010" y="46">+12 V</text>
    <line x1="760" y1="66" x2="792" y2="66" stroke="#111827" stroke-width="2.5"/>
    <text x="800" y="70">GND</text>
    <line x1="870" y1="66" x2="902" y2="66" stroke="#b91c1c" stroke-width="3.5" stroke-dasharray="7 4"/>
    <text x="910" y="70">230 V mains</text>
  </g>

  <!-- ============ controller ============ -->
  <rect x="440" y="180" width="230" height="360" rx="6" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="555" y="208" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">ARDUINO</text>
  <text x="555" y="226" font-size="11" fill="#6b7280" text-anchor="middle">ATmega328 (Uno / Nano)</text>
  <line x1="440" y1="240" x2="670" y2="240" stroke="#d1d5db" stroke-width="1"/>

  <!-- input pin labels (left edge) -->
  <g font-size="12" font-weight="700" fill="#111827">
    <text x="452" y="278">A1</text>
    <text x="452" y="330">D2</text>
    <text x="452" y="392">A4</text>
    <text x="452" y="410">A5</text>
  </g>
  <!-- output pin labels (right edge) -->
  <g font-size="12" font-weight="700" fill="#111827" text-anchor="end">
    <text x="658" y="278">D4</text>
    <text x="658" y="330">D3</text>
    <text x="658" y="392">D7</text>
    <text x="658" y="454">D8</text>
  </g>
  <!-- power pins -->
  <g font-size="12" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="490" y="522">5V</text>
    <text x="555" y="522">GND</text>
    <text x="625" y="522">VIN</text>
  </g>
  <line x1="440" y1="496" x2="670" y2="496" stroke="#d1d5db" stroke-width="1"/>

  <!-- ============ INPUTS (left) ============ -->
  <!-- soil sensor -->
  <rect x="60" y="248" width="250" height="60" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="76" y="272" font-size="13" font-weight="700" fill="#111827">Capacitive Soil Moisture v2.0</text>
  <text x="76" y="292" font-size="11" fill="#6b7280">AOUT  ·  VCC  ·  GND</text>
  <line x1="310" y1="274" x2="440" y2="274" stroke="#2563eb" stroke-width="2.5"/>
  <text x="375" y="266" font-size="10" fill="#2563eb" text-anchor="middle">AOUT</text>

  <!-- dht11 -->
  <rect x="60" y="330" width="250" height="60" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="76" y="354" font-size="13" font-weight="700" fill="#111827">DHT11</text>
  <text x="76" y="374" font-size="11" fill="#6b7280">temperature  ·  DATA  ·  VCC  ·  GND</text>
  <line x1="310" y1="326" x2="400" y2="326" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="400" y1="326" x2="400" y2="326" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="400" y1="326" x2="440" y2="326" stroke="#2563eb" stroke-width="2.5"/>
  <text x="375" y="318" font-size="10" fill="#2563eb" text-anchor="middle">DATA</text>

  <!-- oled -->
  <rect x="60" y="412" width="250" height="60" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="76" y="436" font-size="13" font-weight="700" fill="#111827">SSD1306 OLED  128x64</text>
  <text x="76" y="456" font-size="11" fill="#6b7280">I2C addr 0x3C  ·  SDA  ·  SCL</text>
  <line x1="310" y1="388" x2="420" y2="388" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="420" y1="388" x2="440" y2="388" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="310" y1="406" x2="420" y2="406" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="420" y1="406" x2="440" y2="406" stroke="#2563eb" stroke-width="2.5"/>
  <text x="378" y="382" font-size="10" fill="#2563eb" text-anchor="middle">SDA</text>
  <text x="378" y="422" font-size="10" fill="#2563eb" text-anchor="middle">SCL</text>

  <!-- ============ OUTPUTS (right) ============ -->
  <!-- servo : direct from D4 -->
  <line x1="670" y1="274" x2="880" y2="274" stroke="#2563eb" stroke-width="2.5"/>
  <text x="775" y="266" font-size="10" fill="#2563eb" text-anchor="middle">PWM</text>
  <rect x="880" y="248" width="220" height="60" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="896" y="272" font-size="13" font-weight="700" fill="#111827">Vent hatch servo</text>
  <text x="896" y="292" font-size="11" fill="#6b7280">0&#176; closed  ·  45&#176; open</text>

  <!-- fan driver -->
  <line x1="670" y1="326" x2="746" y2="326" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="746" y="300" width="104" height="60" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="798" y="326" font-size="11" font-weight="700" fill="#9a3412" text-anchor="middle">SWITCH</text>
  <text x="798" y="342" font-size="9" fill="#9a3412" text-anchor="middle">relay / MOSFET</text>
  <line x1="850" y1="326" x2="880" y2="326" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="880" y="300" width="220" height="60" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="896" y="324" font-size="13" font-weight="700" fill="#111827">Extraction fan</text>
  <text x="896" y="344" font-size="11" fill="#6b7280">12 V  ·  on above 27 &#176;C</text>

  <!-- pump driver -->
  <line x1="670" y1="388" x2="746" y2="388" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="746" y="362" width="104" height="60" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="798" y="388" font-size="11" font-weight="700" fill="#9a3412" text-anchor="middle">SWITCH</text>
  <text x="798" y="404" font-size="9" fill="#9a3412" text-anchor="middle">relay / MOSFET</text>
  <line x1="850" y1="388" x2="880" y2="388" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="880" y="362" width="220" height="60" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="896" y="386" font-size="13" font-weight="700" fill="#111827">Irrigation pump</text>
  <text x="896" y="406" font-size="11" fill="#6b7280">5 V  ·  5 s run, 5 min lockout</text>

  <!-- lamp relay -->
  <line x1="670" y1="450" x2="746" y2="450" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="746" y="424" width="104" height="60" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="798" y="450" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">RELAY</text>
  <text x="798" y="466" font-size="9" fill="#7f1d1d" text-anchor="middle">mains rated</text>
  <line x1="850" y1="450" x2="880" y2="450" stroke="#b91c1c" stroke-width="3.5" stroke-dasharray="7 4"/>
  <rect x="880" y="424" width="220" height="60" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="896" y="448" font-size="13" font-weight="700" fill="#111827">Grow lamp</text>
  <text x="896" y="468" font-size="11" fill="#6b7280">230 V  ·  12 h on, 12 h off</text>

  <!-- ============ power ============ -->
  <rect x="60" y="600" width="1040" height="118" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="80" y="628" font-size="13" font-weight="700" fill="#111827">POWER</text>

  <rect x="80" y="644" width="150" height="52" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
  <text x="155" y="666" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">12 V DC</text>
  <text x="155" y="684" font-size="10" fill="#6b7280" text-anchor="middle">supply</text>

  <line x1="230" y1="662" x2="300" y2="662" stroke="#ea580c" stroke-width="2.5"/>
  <text x="312" y="666" font-size="11" fill="#374151">VIN, and the 12 V fan</text>

  <rect x="520" y="644" width="150" height="52" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
  <text x="595" y="666" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">5 V rail</text>
  <text x="595" y="684" font-size="10" fill="#6b7280" text-anchor="middle">sensors, OLED, servo, pump</text>

  <line x1="670" y1="662" x2="740" y2="662" stroke="#dc2626" stroke-width="2.5"/>
  <text x="752" y="658" font-size="11" fill="#374151">The servo and the pump draw more than the on-board</text>
  <text x="752" y="674" font-size="11" fill="#374151">regulator should supply. Feed them from the supply, not</text>
  <text x="752" y="690" font-size="11" fill="#374151">from the Arduino 5V pin. All grounds common.</text>

  <!-- ============ footnote ============ -->
  <text x="40" y="758" font-size="11" fill="#6b7280">Every load needs a flyback diode across it. The switching parts are drawn as blocks: the firmware only drives each pin high or low,</text>
  <text x="40" y="776" font-size="11" fill="#6b7280">so it does not record which device does the switching.</text>
  <text x="40" y="800" font-size="11" font-weight="700" fill="#7f1d1d">230 V is lethal. Mains wiring stays inside an enclosure, on a mains-rated relay, and the supply is unplugged while working on it.</text>
</svg>
