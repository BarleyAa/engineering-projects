<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" width="1160" height="850" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1160" height="850" fill="#ffffff"/>

  <!-- ================= title ================= -->
  <text x="40" y="52" font-size="23" font-weight="700" fill="#111827">Automated Growhouse</text>
  <text x="40" y="76" font-size="13" fill="#6b7280">Wiring diagram. Pin assignments taken from src/growhouse.ino</text>

  <!-- ================= legend ================= -->
  <g font-size="11" fill="#374151">
    <line x1="742" y1="42" x2="774" y2="42" stroke="#2563eb" stroke-width="2.5"/>
    <text x="782" y="46">signal</text>
    <line x1="856" y1="42" x2="888" y2="42" stroke="#dc2626" stroke-width="2.5"/>
    <text x="896" y="46">+5 V</text>
    <line x1="962" y1="42" x2="994" y2="42" stroke="#ea580c" stroke-width="2.5"/>
    <text x="1002" y="46">+12 V</text>
    <line x1="742" y1="68" x2="774" y2="68" stroke="#b91c1c" stroke-width="3.5" stroke-dasharray="7 4"/>
    <text x="782" y="72">230 V mains</text>
    <circle cx="872" cy="68" r="4" fill="#111827"/>
    <text x="896" y="72">connection</text>
  </g>

  <!-- ================= controller =================
       box spans y 190..570 ; left edge x=440 ; right edge x=670
       LEFT  rows  285 / 350 / 415 / 437
       RIGHT rows  285 / 350 / 420 / 490
  -->
  <rect x="440" y="190" width="230" height="380" rx="6" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="555" y="220" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">ARDUINO</text>
  <text x="555" y="238" font-size="11" fill="#6b7280" text-anchor="middle">ATmega328 (Uno / Nano)</text>
  <line x1="440" y1="252" x2="670" y2="252" stroke="#d1d5db" stroke-width="1"/>

  <!-- input pin labels, baseline = row + 4 -->
  <g font-size="12" font-weight="700" fill="#111827">
    <text x="452" y="289">A1</text>
    <text x="452" y="354">D2</text>
    <text x="452" y="419">A4</text>
    <text x="452" y="441">A5</text>
  </g>
  <!-- output pin labels -->
  <g font-size="12" font-weight="700" fill="#111827" text-anchor="end">
    <text x="658" y="289">D4</text>
    <text x="658" y="354">D3</text>
    <text x="658" y="424">D7</text>
    <text x="658" y="494">D8</text>
  </g>
  <!-- power pins -->
  <line x1="440" y1="520" x2="670" y2="520" stroke="#d1d5db" stroke-width="1"/>
  <g font-size="12" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="492" y="548">5V</text>
    <text x="555" y="548">GND</text>
    <text x="620" y="548">VIN</text>
  </g>

  <!-- ================= INPUTS (left) ================= -->

  <!-- soil sensor : row 285 , box 255..315 -->
  <rect x="60" y="255" width="250" height="60" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="76" y="280" font-size="13" font-weight="700" fill="#111827">Capacitive Soil Moisture v2.0</text>
  <text x="76" y="299" font-size="11" fill="#6b7280">AOUT  ·  VCC  ·  GND</text>
  <line x1="310" y1="285" x2="440" y2="285" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="310" cy="285" r="4" fill="#111827"/>
  <circle cx="440" cy="285" r="4" fill="#111827"/>
  <text x="375" y="277" font-size="10" fill="#2563eb" text-anchor="middle">AOUT</text>

  <!-- dht11 : row 350 , box 320..380 -->
  <rect x="60" y="320" width="250" height="60" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="76" y="345" font-size="13" font-weight="700" fill="#111827">DHT11</text>
  <text x="76" y="364" font-size="11" fill="#6b7280">temperature  ·  DATA  ·  VCC  ·  GND</text>
  <line x1="310" y1="350" x2="440" y2="350" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="310" cy="350" r="4" fill="#111827"/>
  <circle cx="440" cy="350" r="4" fill="#111827"/>
  <text x="375" y="342" font-size="10" fill="#2563eb" text-anchor="middle">DATA</text>

  <!-- oled : rows 415 and 437 , box 395..471 -->
  <rect x="60" y="395" width="250" height="76" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="76" y="420" font-size="13" font-weight="700" fill="#111827">SSD1306 OLED  128x64</text>
  <text x="76" y="439" font-size="11" fill="#6b7280">I2C address 0x3C</text>
  <text x="76" y="458" font-size="11" fill="#6b7280">SDA  ·  SCL  ·  VCC  ·  GND</text>
  <line x1="310" y1="415" x2="440" y2="415" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="310" cy="415" r="4" fill="#111827"/>
  <circle cx="440" cy="415" r="4" fill="#111827"/>
  <text x="375" y="407" font-size="10" fill="#2563eb" text-anchor="middle">SDA</text>
  <line x1="310" y1="437" x2="440" y2="437" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="310" cy="437" r="4" fill="#111827"/>
  <circle cx="440" cy="437" r="4" fill="#111827"/>
  <text x="375" y="455" font-size="10" fill="#2563eb" text-anchor="middle">SCL</text>

  <!-- ================= OUTPUTS (right) ================= -->

  <!-- servo, straight from D4 : row 285 , box 255..315 -->
  <line x1="670" y1="285" x2="880" y2="285" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="670" cy="285" r="4" fill="#111827"/>
  <circle cx="880" cy="285" r="4" fill="#111827"/>
  <text x="775" y="277" font-size="10" fill="#2563eb" text-anchor="middle">PWM</text>
  <rect x="880" y="255" width="220" height="60" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="896" y="280" font-size="13" font-weight="700" fill="#111827">Vent hatch servo</text>
  <text x="896" y="299" font-size="11" fill="#6b7280">0&#176; closed  ·  45&#176; open</text>

  <!-- fan : row 350 , boxes 320..380 -->
  <line x1="670" y1="350" x2="746" y2="350" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="670" cy="350" r="4" fill="#111827"/>
  <rect x="746" y="320" width="104" height="60" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="798" y="346" font-size="11" font-weight="700" fill="#9a3412" text-anchor="middle">SWITCH</text>
  <text x="798" y="362" font-size="9" fill="#9a3412" text-anchor="middle">relay / MOSFET</text>
  <line x1="850" y1="350" x2="880" y2="350" stroke="#ea580c" stroke-width="2.5"/>
  <circle cx="880" cy="350" r="4" fill="#111827"/>
  <rect x="880" y="320" width="220" height="60" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="896" y="345" font-size="13" font-weight="700" fill="#111827">Extraction fan</text>
  <text x="896" y="364" font-size="11" fill="#6b7280">12 V  ·  on above 27 &#176;C</text>

  <!-- pump : row 420 , boxes 390..450 -->
  <line x1="670" y1="420" x2="746" y2="420" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="670" cy="420" r="4" fill="#111827"/>
  <rect x="746" y="390" width="104" height="60" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="798" y="416" font-size="11" font-weight="700" fill="#9a3412" text-anchor="middle">SWITCH</text>
  <text x="798" y="432" font-size="9" fill="#9a3412" text-anchor="middle">relay / MOSFET</text>
  <line x1="850" y1="420" x2="880" y2="420" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="880" cy="420" r="4" fill="#111827"/>
  <rect x="880" y="390" width="220" height="60" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
  <text x="896" y="415" font-size="13" font-weight="700" fill="#111827">Irrigation pump</text>
  <text x="896" y="434" font-size="11" fill="#6b7280">5 V  ·  5 s run, 5 min lockout</text>

  <!-- lamp : row 490 , boxes 460..520 -->
  <line x1="670" y1="490" x2="746" y2="490" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="670" cy="490" r="4" fill="#111827"/>
  <rect x="746" y="460" width="104" height="60" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="798" y="486" font-size="11" font-weight="700" fill="#7f1d1d" text-anchor="middle">RELAY</text>
  <text x="798" y="502" font-size="9" fill="#7f1d1d" text-anchor="middle">mains rated</text>
  <line x1="850" y1="490" x2="880" y2="490" stroke="#b91c1c" stroke-width="3.5" stroke-dasharray="7 4"/>
  <circle cx="880" cy="490" r="4" fill="#111827"/>
  <rect x="880" y="460" width="220" height="60" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="896" y="485" font-size="13" font-weight="700" fill="#111827">Grow lamp</text>
  <text x="896" y="504" font-size="11" fill="#6b7280">230 V  ·  12 h on, 12 h off</text>

  <!-- ================= power notes ================= -->
  <rect x="60" y="610" width="1040" height="120" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="82" y="638" font-size="13" font-weight="700" fill="#111827">POWER</text>

  <rect x="82" y="654" width="14" height="14" rx="2" fill="#ea580c"/>
  <text x="106" y="666" font-size="12" font-weight="700" fill="#111827">12 V DC supply</text>
  <text x="106" y="684" font-size="11" fill="#6b7280">Feeds the Arduino VIN and the extraction fan.</text>

  <rect x="480" y="654" width="14" height="14" rx="2" fill="#dc2626"/>
  <text x="504" y="666" font-size="12" font-weight="700" fill="#111827">5 V rail</text>
  <text x="504" y="684" font-size="11" fill="#6b7280">Sensors and OLED. The servo and the pump draw more than the on-board</text>
  <text x="504" y="700" font-size="11" fill="#6b7280">regulator should supply, so feed those two from the supply, not from the</text>
  <text x="504" y="716" font-size="11" fill="#6b7280">Arduino 5V pin. All grounds must be common.</text>

  <!-- ================= footnotes ================= -->
  <text x="40" y="770" font-size="11" fill="#6b7280">Every inductive load needs a flyback diode across it. The switching parts are drawn as blocks: the firmware only drives each pin</text>
  <text x="40" y="788" font-size="11" fill="#6b7280">high or low, so it does not record which device does the switching.</text>
  <text x="40" y="814" font-size="11" font-weight="700" fill="#7f1d1d">230 V is lethal. Mains wiring stays inside an enclosure, on a mains-rated relay, and the supply is unplugged while working on it.</text>
</svg>
